name: Verify

on:
  push:
    branches:
      - claude/physiovision-ai-platform-49ysp2
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Phase 44: licences, known vulnerabilities, software bill of materials.
      - run: npm run licences
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - run: npm test
      - run: npm run build
      # Phase 43: sizes are reported on every run; only budgets the owner has set can fail it.
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-size
          path: |
            sbom.cdx.json
            size-report.json

  browser:
    # Phase 42 + 39: demo journeys with the simulated camera, and the automated accessibility audit.
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          CI: 'true'
      - name: Accessibility audit
        run: |
          node scripts/serve-dist.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e-report
            test-results
            a11y-report.json
